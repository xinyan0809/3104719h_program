<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      width: min(92vw, 460px);
      padding: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 16px 40px rgba(18, 38, 63, 0.12);
    }
    h1 { margin: 0 0 20px; }
    label { display: block; margin: 14px 0 6px; }
    input {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #ccd5e1;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .helptext {
      display: block;
      margin-top: 6px;
      color: #667085;
      font-size: 13px;
    }
    .helptext ul { margin: 8px 0 0; padding-left: 20px; }
    .errorlist {
      color: #b42318;
      padding-left: 18px;
    }
    button {
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    .secondary { margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Register and log in</button>
    </form>
    <p class="secondary">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </main>
</body>
</html>
