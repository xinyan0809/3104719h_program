<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      width: min(92vw, 520px);
      padding: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 16px 40px rgba(18, 38, 63, 0.12);
    }
    h1 { margin: 0 0 12px; }
    p { line-height: 1.6; }
    form { margin-top: 24px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #d92d20;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome, {{ request.user.username }}</h1>
    <p>You are signed in. This is your home page.</p>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  </main>
</body>
</html>
