{% extends "base.html" %}

{% block title %}User Profile | PosePlay{% endblock %}

{% block content %}
  <section class="content-card" aria-labelledby="page-title">
    <header class="page-heading">
      <p class="eyebrow">Account</p>
      <h1 id="page-title">User Profile</h1>
      <p class="page-heading__summary">Your current PosePlay account details.</p>
    </header>

    <div class="stack stack--compact">
      <div class="panel panel--subtle">
        <p class="text-small text-muted">Username</p>
        <p><strong>{{ request.user.username }}</strong></p>
      </div>
      <div class="panel panel--subtle">
        <p class="text-small text-muted">Email</p>
        <p><strong>{{ request.user.email|default:"Not provided" }}</strong></p>
      </div>
    </div>

    <div class="cluster section--compact">
      <a class="button button--primary" href="{% url 'game_selection' %}">Play Game</a>
    </div>
  </section>
{% endblock %}
