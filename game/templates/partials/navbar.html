<nav class="primary-nav" aria-label="Primary navigation">
  <ul class="primary-nav__list">
    {% if request.user.is_authenticated %}
      <li>
        <a
          class="primary-nav__link"
          href="{% url 'home' %}"
          {% if request.resolver_match.url_name == "home" %}aria-current="page"{% endif %}
        >
          Home
        </a>
      </li>
      <li>
        <a
          class="primary-nav__link"
          href="{% url 'game_selection' %}"
          {% if request.resolver_match.url_name == "game_selection" or request.resolver_match.url_name == "fruit_catch" %}aria-current="page"{% endif %}
        >
          Play Game
        </a>
      </li>
      <li>
        <a
          class="primary-nav__link"
          href="{% url 'user_profile' %}"
          {% if request.resolver_match.url_name == "user_profile" %}aria-current="page"{% endif %}
        >
          User Profile
        </a>
      </li>
      <li class="primary-nav__identity">
        <span class="user-chip" aria-label="Signed in as {{ request.user.username }}">
          <span class="user-chip__label">Signed in</span>
          <strong>{{ request.user.username }}</strong>
        </span>
      </li>
      <li>
        <form class="logout-form" method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="nav-button" type="submit">Log out</button>
        </form>
      </li>
    {% else %}
      <li>
        <a
          class="primary-nav__link"
          href="{% url 'login' %}"
          {% if request.resolver_match.url_name == "login" %}aria-current="page"{% endif %}
        >
          Log in
        </a>
      </li>
      <li>
        <a
          class="button button--small button--primary"
          href="{% url 'register' %}"
          {% if request.resolver_match.url_name == "register" %}aria-current="page"{% endif %}
        >
          Register
        </a>
      </li>
    {% endif %}
  </ul>
</nav>
