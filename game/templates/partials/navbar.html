<nav class="primary-nav" aria-label="Primary navigation">
  <ul class="primary-nav__list">
    {% if request.user.is_authenticated %}
      <li>
        <a
          class="primary-nav__link"
          href="{% url 'home' %}"
          {% if request.resolver_match.url_name == "home" %}aria-current="page"{% endif %}
        >
          Home
        </a>
      </li>
      <li>
        <a
          class="primary-nav__link"
          href="{% url 'game_selection' %}"
          {% if request.resolver_match.url_name == "game_selection" or request.resolver_match.url_name == "fruit_catch" %}aria-current="page"{% endif %}
        >
          Play Game
        </a>
      </li>
      <li>
        <a
          class="primary-nav__link"
          href="{% url 'user_profile' %}"
          {% if request.resolver_match.url_name == "user_profile" %}aria-current="page"{% endif %}
        >
          User Profile
        </a>
      </li>
      <li class="account-menu-item">
        <details class="account-menu">
          <summary
            class="account-menu__trigger"
            aria-label="Open account menu for {{ request.user.username }}"
          >
            {% if request.user.user_profile.avatar %}
              <img
                src="{{ request.user.user_profile.avatar.url }}"
                alt=""
                class="account-menu__avatar"
              >
            {% else %}
              <span class="account-menu__fallback" aria-hidden="true">👤</span>
            {% endif %}
          </summary>
          <div class="account-menu__dropdown">
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="account-menu__logout" type="submit">Log out</button>
            </form>
          </div>
        </details>
      </li>
    {% else %}
      <li>
        <a
          class="primary-nav__link"
          href="{% url 'login' %}"
          {% if request.resolver_match.url_name == "login" %}aria-current="page"{% endif %}
        >
          Log in
        </a>
      </li>
      <li>
        <a
          class="button button--small button--primary"
          href="{% url 'register' %}"
          {% if request.resolver_match.url_name == "register" %}aria-current="page"{% endif %}
        >
          Register
        </a>
      </li>
    {% endif %}
  </ul>
</nav>
