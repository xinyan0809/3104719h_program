<aside
  id="cookie-notice"
  class="cookie-notice"
  aria-labelledby="cookie-notice-title"
  hidden
>
  <div class="cookie-notice__inner">
    <div class="cookie-notice__copy">
      <span class="cookie-notice__label">Essential cookies</span>
      <h2 id="cookie-notice-title">This prototype uses essential cookies</h2>
      <p>
        Django uses cookies to maintain your sign-in session and protect forms.
        No advertising or pose-tracking cookies are used, and webcam or pose
        data remains in this browser.
      </p>
    </div>
    <button
      id="acknowledge-cookies"
      class="button button--primary cookie-notice__action"
      type="button"
    >
      Understood
    </button>
  </div>
</aside>
