services:
  - type: web
    name: motion-rehab-games
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn Game_web.wsgi:application
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SERVE_MEDIA_FILES
        value: 'True'
      - key: DATABASE_URL
        fromDatabase:
          name: motion-rehab-games-db
          property: connectionString

databases:
  - name: motion-rehab-games-db
    plan: free
    region: singapore
    databaseName: motion_rehab_games
    user: motion_rehab_games
